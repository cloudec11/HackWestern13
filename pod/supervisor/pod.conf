# Pod processes run by pod-supervisor. Paths are relative to ~/pod-deploy on the Pi.
# <name> <prio 0=normal, 1..63=SCHED_FIFO> <beat|exit> <command> [args...]
# Camera service must be on the Pod config first: sh pod/scripts/camera_service.sh pod
#
capture  30  beat  ./build/capture/pod-capture --prio 30 --stats 30
log      20  beat  ./build/log/pod-log --pod-id pod-01 --dir pod-data/events --uplink-state pod-data/uplink
uplink    0  exit  python3 pod/uplink/uplink.py --events-dir pod-data/events --state-dir pod-data/uplink
# Location (POD_LAT/POD_LON in ~/pod.env, else IP lookup) + Open-Meteo weather every 10 min -> pod-data/weather.json,
# served by pod-view at /weather.json for the dashboard's Live mode. Needs internet; without it the old file stays.
weather   0  exit  python3 pod/uplink/weather.py --out pod-data/weather.json
#
# Detection chain (agent-2's programs). Binaries are copied from ~/agent2/build to ~/pod-deploy/build
# (deploy.sh does not build them: they need the TFLite build); the model is models/efficientdet_lite0.tflite.
# They do not beat, so the supervisor restarts them only when they exit.
# pod-infer needs I/O privilege (TFLite/XNNPACK reads a CPU register), which the supervisor's user
# (qnxuser) does not have, so it runs through passwordless sudo. A SIGKILL of the sudo wrapper would leave
# pod-infer running as root; the supervisor's normal stop is SIGTERM, which sudo passes on.
# Order does not matter: queues are reopened on every send.
# pod-infer sends to /pod_view_dets; pod-view (below) shows the boxes and forwards every message to
# pod-track's /pod_dets. If pod-view is off, change --dets-mq to /pod_dets (the default) so pod-track
# is fed directly.
track     0  exit  ./build/track/pod-track --stats 30 --quiet
infer     0  exit  sudo -n ./build/infer/pod-infer --dets-mq /pod_view_dets --stats 30 --quiet --min-score 0.3 --health-out pod-data/uplink/heartbeat.json
#
# Live view for setup and the demo. Open http://qnxpi.local:8080 (normal priority, below everything above).
# Remove this line to turn the viewer off, and see the note above.
view      0  exit  ./build/capture/pod-view --port 8080 --dets-in /pod_view_dets --dets-out /pod_dets
