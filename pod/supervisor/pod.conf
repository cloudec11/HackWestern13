# Pod processes run by pod-supervisor. Paths are relative to ~/pod-deploy on the Pi.
# <name> <prio 0=normal, 1..63=SCHED_FIFO> <beat|exit> <command> [args...]
# Camera service must be on the Pod config first: sh pod/scripts/camera_service.sh pod
#
# pod-infer and pod-track (agent-2) are added here once they exist.
capture  30  beat  ./build/capture/pod-capture --prio 30 --stats 30
log      20  beat  ./build/log/pod-log --pod-id pod-01 --dir pod-data/events --uplink-state pod-data/uplink
uplink    0  exit  python3 pod/uplink/uplink.py --events-dir pod-data/events --state-dir pod-data/uplink
#
# Live view for setup and the demo (off by default; uncomment to enable). Open http://qnxpi.local:8080
# Normal priority, below everything above. With detections, also start pod-infer with
# --dets-mq /pod_view_dets; pod-view forwards every message on to pod-track's /pod_dets.
# view      0  exit  ./build/capture/pod-view --port 8080 --dets-in /pod_view_dets --dets-out /pod_dets
