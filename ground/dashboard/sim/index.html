<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pod · Habitat view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f3f5f7; }
  #app canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .card { position: fixed; background: rgba(12, 16, 22, 0.72); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 12px 14px; }
  #hud { top: 16px; left: 16px; max-width: min(360px, calc(100vw - 32px)); }
  #hud .title { font-weight: 650; font-size: 16px; }
  #hud .weather { margin-top: 4px; font-size: 15px; }
  #hud .animals { margin-top: 8px; color: #d6dde4; }
  #hud .src { margin-top: 8px; font-size: 12px; color: #9aa8b5; }
  #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.75); text-shadow: 0 1px 3px #000; pointer-events: none; }
  #dev { bottom: 16px; right: 16px; font-size: 12px; display: grid; gap: 6px; min-width: 190px; }
  #dev .h { font-weight: 600; color: #9aa8b5; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
  #dev label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #dev select, #dev input[type=range] { width: 110px; }
  #error { position: fixed; top: 16px; right: 16px; background: #7a2a1f; padding: 8px 12px; border-radius: 8px; font-size: 12px; }
  @media (max-width: 520px) { #dev { left: 16px; right: 16px; bottom: 40px; } #hint { bottom: 8px; } }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="card">
  <div class="title" id="hud-title">Loading habitat…</div>
  <div class="weather" id="hud-weather"></div>
  <div class="animals" id="hud-animals"></div>
  <div class="src" id="hud-src"></div>
</div>

<div id="hint">Drag to look around · scroll to zoom</div>

<div id="dev" class="card">
  <div class="h">Dev controls (temporary)</div>
  <label>Biome
    <select id="dev-biome">
      <option value="">from data</option>
      <option value="forest">Forest</option>
      <option value="savanna">Savanna</option>
      <option value="desert">Desert</option>
      <option value="snow">Snowy taiga</option>
    </select>
  </label>
  <label>Weather
    <select id="dev-weather">
      <option value="">from data</option>
      <option value="clear">Clear</option>
      <option value="cloudy">Cloudy</option>
      <option value="rain">Rain</option>
      <option value="storm">Storm</option>
      <option value="snow">Snow</option>
      <option value="fog">Fog</option>
    </select>
  </label>
  <label>Hour <input id="dev-hour" type="range" min="0" max="24" step="0.25"></label>
  <label>Labels <input id="dev-labels" type="checkbox" checked></label>
</div>

<div id="error" hidden></div>

<script src="sim.js"></script>
</body>
</html>
